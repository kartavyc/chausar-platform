name: D6 extraction validation
on:
  push:
    branches: ['b2c/os-d6-check-*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:ui
        if: '!cancelled()'
      - run: node scripts/check.mjs
        if: '!cancelled()'
      - run: node scripts/third-party-notices.mjs --check
        if: '!cancelled()'
      - run: node --test --test-concurrency=2 platform/tests/venture-contracts.test.ts platform/tests/venture-method-hints.test.ts platform/tests/venture-engine.test.ts platform/tests/hosted-runtime.test.ts platform/tests/desktop-ipc-methods.test.ts
        if: '!cancelled()'
      - run: node --test platform/tests/contracts-types-only-d6.test.ts
        if: '!cancelled()'
      - run: |
          node .github/d6-measure.mjs
          for i in 1 2 3; do node .github/d6-count-modules.mjs "$GITHUB_WORKSPACE/platform/runtime/worker.ts" > "$RUNNER_TEMP/d6-worker-after-$i.json"; done
        if: '!cancelled()'
      - run: npx vitest run --config app/ui/vitest.config.ts app/ui/tests/engine
        if: '!cancelled()'
      - run: npm run build:ui
        if: '!cancelled()'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d6-after
          path: ${{ runner.temp }}/d6-*.json
