name: D6 extraction validation
on:
  push:
    branches: ['b2c/os-d6-check-*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:ui
        if: '!cancelled()'
      - run: node scripts/check.mjs
        if: '!cancelled()'
      - run: node scripts/third-party-notices.mjs --check
        if: '!cancelled()'
      - run: node --test --test-concurrency=2 platform/tests/venture-contracts.test.ts platform/tests/venture-method-hints.test.ts platform/tests/venture-engine.test.ts platform/tests/hosted-runtime.test.ts platform/tests/desktop-ipc-methods.test.ts
        if: '!cancelled()'
      - run: node --test --test-name-pattern='contract-values exports' platform/tests/contracts-types-only-d6.test.ts
        if: '!cancelled()'