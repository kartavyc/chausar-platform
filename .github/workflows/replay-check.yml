name: Replay snapshot checks
on:
  push:
    branches: ['b2c/os-replay-check-*']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Focused replay and native tests
        run: |
          mkdir -p /tmp/replay-receipts
          set -o pipefail
          node --test --test-concurrency=1 platform/tests/engine-replay-d11.test.ts platform/tests/native-replay-d11.test.ts platform/tests/replay-hooks-d11.test.ts platform/tests/run-capture-d11.test.ts platform/tests/replay-runs-d11.test.ts platform/tests/venture-codex-driver-w6.test.ts platform/tests/claude-agent-driver-w6.test.ts platform/tests/agent-delivery-w6.test.ts platform/tests/agent-native-job-w6.test.ts platform/tests/engine-bundle-rules-d7.test.ts 2>&1 | tee /tmp/replay-receipts/tests.log
      - name: Engine types
        if: always()
        run: |
          mkdir -p /tmp/replay-receipts
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/replay-receipts/types.log
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-snapshot-receipts
          path: /tmp/replay-receipts
