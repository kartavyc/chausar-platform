name: Dispatch snapshot checks
on:
  push:
    branches: ['b2c/os-dispatch-check-*']
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      CHAUSAR_RUN_ROOT: /tmp/dispatch-receipts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lazy and tier regressions
        run: |
          mkdir -p /tmp/dispatch-receipts
          set -o pipefail
          timeout 600s node --test --test-concurrency=2 platform/tests/engine-dispatch-d11.test.ts platform/tests/engine-legacy-lazy-d10.test.ts platform/tests/method-registry-d8.test.ts platform/tests/desktop-harness.test.ts platform/tests/desktop-ipc-methods.test.ts platform/tests/venture-evidence.test.ts platform/tests/venture-journal.test.ts platform/tests/venture-journal-resolve.test.ts platform/tests/venture-share-links.test.ts platform/tests/vault-key-memo-d11.test.ts platform/tests/vault-ladder-open-d12.test.ts platform/tests/runtime-map-d11.test.ts platform/tests/sync-engine.test.ts platform/tests/phone-engine-public-join.test.ts platform/tests/workspace-custody.test.ts platform/tests/server-auth.test.ts platform/tests/desktop-runtime.test.ts platform/tests/engine-replay-d11.test.ts 2>&1 | tee /tmp/dispatch-receipts/tests.log
      - name: Focused receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-focused-receipts
          path: /tmp/dispatch-receipts
      - name: Engine types
        if: always()
        run: |
          mkdir -p /tmp/dispatch-receipts
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/dispatch-receipts/types.log
      - name: UI types
        if: always()
        run: |
          mkdir -p /tmp/dispatch-receipts
          set -o pipefail
          npm run typecheck:ui 2>&1 | tee /tmp/dispatch-receipts/ui-types.log
      - name: Source checks
        if: always()
        run: |
          mkdir -p /tmp/dispatch-receipts
          set -o pipefail
          node scripts/check.mjs 2>&1 | tee /tmp/dispatch-receipts/checks.log
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-snapshot-receipts
          path: /tmp/dispatch-receipts








