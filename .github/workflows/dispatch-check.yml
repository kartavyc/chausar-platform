name: Dispatch snapshot checks
on:
  push:
    branches: ['b2c/os-dispatch-check-*']
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      CHAUSAR_RUN_ROOT: /tmp/dispatch-receipts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lazy and tier regressions
        run: |
          mkdir -p /tmp/dispatch-receipts
          set -o pipefail
          timeout 600s node --test --test-concurrency=2 platform/tests/owner-internal-b1.test.ts platform/tests/venture-owner-today-b2.test.ts platform/tests/venture-host.test.ts platform/tests/venture-net-guard.test.ts platform/tests/venture-core.test.ts platform/tests/*replay*.test.ts 2>&1 | tee /tmp/dispatch-receipts/tests.log
      - name: Focused receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-focused-receipts
          path: /tmp/dispatch-receipts
      - name: Engine types
        if: always()
        run: |
          mkdir -p /tmp/dispatch-receipts
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/dispatch-receipts/types.log
      - name: UI types
        if: always()
        run: |
          mkdir -p /tmp/dispatch-receipts
          set -o pipefail
          npm run typecheck:ui 2>&1 | tee /tmp/dispatch-receipts/ui-types.log
      - name: Source checks
        if: always()
        run: |
          mkdir -p /tmp/dispatch-receipts
          set -o pipefail
          node scripts/check.mjs 2>&1 | tee /tmp/dispatch-receipts/checks.log
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-snapshot-receipts
          path: /tmp/dispatch-receipts









