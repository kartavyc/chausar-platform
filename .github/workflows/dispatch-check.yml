name: Dispatch snapshot checks
on:
  push:
    branches: ['b2c/os-dispatch-check-*']
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      CHAUSAR_RUN_ROOT: /tmp/dispatch-receipts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lazy and tier regressions
        run: |
          mkdir -p /tmp/dispatch-receipts
          set -o pipefail
          timeout 120s node --test platform/tests/engine-legacy-lazy-d10.test.ts 2>&1 | tee /tmp/dispatch-receipts/tests.log
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-snapshot-receipts
          path: /tmp/dispatch-receipts

