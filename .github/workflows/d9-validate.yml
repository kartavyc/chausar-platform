name: D9 chunks validation
on:
  push:
    branches: ['b2c/os-d9-check-*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - if: '!cancelled()'
        run: npm run typecheck:ui
      - if: '!cancelled()'
        run: node --test platform/tests/ui-chunks-d9.test.ts
      - if: '!cancelled()'
        run: node scripts/check.mjs
      - if: '!cancelled()'
        run: node scripts/third-party-notices.mjs --check
      - if: '!cancelled()'
        run: npm run build:ui
      - if: '!cancelled()'
        run: node scripts/ui-chunks.mjs --json > "$RUNNER_TEMP/chunks.json"
      - if: '!cancelled()'
        run: node scripts/ui-chunks.mjs --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chunks-report
          path: ${{ runner.temp }}/chunks.json
