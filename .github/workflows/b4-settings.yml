name: B4 settings red
on:
  push:
    branches: ['b2c/os-b4-settings-check-*']
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck:ui
      - if: '!cancelled()'
        run: npx vitest run --config app/ui/vitest.config.ts app/ui/tests/places/keep-custody.test.tsx --maxWorkers=1 --reporter=default --reporter=json --outputFile=$RUNNER_TEMP/settings.json
      - name: Settings budgets
        if: '!cancelled()'
        run: npx vitest run --config app/ui/vitest.config.ts app/ui/tests/budgets.test.tsx --maxWorkers=1 -t 'business.*stays'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings
          path: ${{ runner.temp }}/settings.json