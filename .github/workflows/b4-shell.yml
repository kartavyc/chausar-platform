name: B4 shell red and run audit
on:
  push:
    branches: ['b2c/os-b4-shell-red-*']
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test platform/tests/venture-views-runs-audit.test.ts
      - if: '!cancelled()'
        run: npx vitest run --config app/ui/vitest.config.ts app/ui/tests/shell/bell.test.tsx app/ui/tests/shell/receipt-sheet.test.tsx --maxWorkers=1 --reporter=default --reporter=json --outputFile=$RUNNER_TEMP/settings.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings
          path: ${{ runner.temp }}/settings.json