name: B4 places validation
on:
  push:
    branches: ['b2c/os-b4-places-check-*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - if: '!cancelled()'
        run: npm run typecheck:ui
      - if: '!cancelled()'
        run: node --test platform/tests/desktop-transcription-files.test.ts platform/tests/agent-settings-methods-w6.test.ts platform/tests/agent-settings-w6.test.ts platform/tests/agent-connectors-settings-w6.test.ts
      - if: '!cancelled()'
        run: npx vitest run --config app/ui/vitest.config.ts money apps charts figure type-faces-b2 contrast values-c3 leaving-c3 skeleton-arrival-c3 skeleton-c3 progress-sites-c3 budgets one-primary-view-b4 languages.test clients.test team.test connect-ai-c5 invoiced-zero-b1 --maxWorkers=1 --reporter=default --reporter=json --outputFile=$RUNNER_TEMP/clients-ui.json
      - if: '!cancelled()'
        run: npm run build:ui
      - if: '!cancelled()'
        run: node scripts/check.mjs
      - if: '!cancelled()'
        run: npx vitest run --config app/ui/vitest.config.ts review-4z2 --testNamePattern="6. Network" --maxWorkers=1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clients-ui-report
          path: ${{ runner.temp }}/clients-ui.json
