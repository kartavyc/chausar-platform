name: B4 places validation
on:
  push:
    branches: ['b2c/os-b4-places-check-*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - if: '!cancelled()'
        run: node --test --test-name-pattern="B4: the cash axis" platform/tests/venture-money-cash.test.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clients-ui-report
          path: ${{ runner.temp }}/clients-ui.json