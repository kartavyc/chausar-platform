name: B4 places validation
on:
  push:
    branches: ['b2c/os-b4-places-check-*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck:ui
      - if: '!cancelled()'
        run: npx vitest run --config app/ui/vitest.config.ts connections-motion-c3 keep-confirm-motion-c3 leaving-c3 arrivals-c3 source-rules --maxWorkers=1
      - if: '!cancelled()'
        run: npm run build:ui
      - if: '!cancelled()'
        run: node scripts/check.mjs
