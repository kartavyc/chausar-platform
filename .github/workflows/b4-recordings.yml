name: D11 recorded RPC red
on:
  push:
    branches: ['b2c/os-b4-recordings-*']
permissions:
  contents: read
jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test --test-concurrency=1 platform/tests/rpc-recorder-d11.test.ts