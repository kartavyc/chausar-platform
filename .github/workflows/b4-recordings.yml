name: D11 saved recording qualification
on:
  push:
    branches: ['b2c/os-b4-recordings-*']
permissions:
  contents: read
jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test --test-concurrency=1 platform/tests/recordings-d11.test.ts platform/tests/rpc-recorder-d11.test.ts platform/tests/env-list-d11.test.ts platform/tests/test-isolation-d2.test.ts
      - run: npx vitest run --config app/ui/vitest.config.ts app/ui/tests/engine/scripted-client.test.ts --maxWorkers=1
      - run: node scripts/env-docs.mjs --check
      - run: node scripts/check.mjs
      - if: always()
        run: npm run typecheck
      - if: always()
        run: npm run typecheck:ui
