# EXPERIMENTAL. Not for production without a security and operations review.
# Run from the repository root (build the image first; see README.md):
#   docker compose -f enterprise/server/compose.yaml up -d
# Every secret is a file under ${CHAUSAR_ENTERPRISE_FILES:-enterprise/server}/secrets/ (never committed).
#
# PostgreSQL accepts TLS connections only (pg_hba.conf has hostssl lines and no plaintext host lines).
# The Chausar server reaches it as `postgres:5432` on a private network and verifies its certificate
# against database-ca.pem (config.json: "database": { "caFile": "/etc/chausar/database-ca.pem" }).
# PostgreSQL is never published to the host; only the HTTPS port of the Chausar server is.

name: chausar-enterprise

services:
  postgres:
    image: postgres:17
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.pem
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: chausar
      POSTGRES_DB: chausar
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # server.key must be owned by uid 999 (the image's postgres user) with mode 0600.
      - ${CHAUSAR_ENTERPRISE_FILES:-.}/database-tls:/etc/postgresql/tls:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks: [database]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "chausar", "-d", "chausar"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: enterprise/server/Dockerfile
    image: chausar-enterprise:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHAUSAR_ENTERPRISE_CONFIG: /etc/chausar/config.json
      CHAUSAR_POSTGRES_URL_FILE: /run/secrets/postgres_url
    secrets: [postgres_url, oidc_client_secret, workspace_passphrase]
    volumes:
      - ${CHAUSAR_ENTERPRISE_FILES:-.}/config.json:/etc/chausar/config.json:ro
      - ${CHAUSAR_ENTERPRISE_FILES:-.}/tls:/etc/chausar/tls:ro
      - ${CHAUSAR_ENTERPRISE_FILES:-.}/database-tls/ca.pem:/etc/chausar/database-ca.pem:ro
      - chausar-server:/var/lib/chausar/server
      - chausar-vaults:/var/lib/chausar/vaults
    networks: [database, front]
    ports:
      - "8443:8443"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGTERM
    stop_grace_period: 75s
    restart: unless-stopped

networks:
  # No route out: the database network is internal to the two containers.
  database:
    internal: true
  front: {}

secrets:
  postgres_password:
    file: ${CHAUSAR_ENTERPRISE_FILES:-.}/secrets/postgres_password
  postgres_url:
    file: ${CHAUSAR_ENTERPRISE_FILES:-.}/secrets/postgres_url
  oidc_client_secret:
    file: ${CHAUSAR_ENTERPRISE_FILES:-.}/secrets/oidc_client_secret
  workspace_passphrase:
    file: ${CHAUSAR_ENTERPRISE_FILES:-.}/secrets/workspace_passphrase

volumes:
  pgdata:
  chausar-server:
  chausar-vaults:
